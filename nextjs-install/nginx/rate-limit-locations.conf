#
# server {} 블록 안에 include 해서 사용. 기존 location /api/ 블록을 대체.
# 더 엄격한 location 을 위로 두어 nginx 의 정규식 location 우선순위에 따라 먼저 매칭.
#
# 사용법:
#   /etc/nginx/sites-available/example.com 의 server {} 안에서:
#       include /etc/nginx/snippets/g5-rate-limit-locations.conf;
#   (기존 location /api/ { rewrite ... } 블록은 제거)
#

# ─── 인증 / 가입 / 디바이스 등록 — 가장 엄격 (브루트포스 방지) ───
location ~ ^/api/v1/(auth/(login|register|social/exchange)|devices/sign) {
    limit_req zone=g5_api_auth burst=5 nodelay;
    rewrite ^/api/(.*)$ /api/index.php?_route=$1 last;
}

# ─── 작성/수정/삭제 등 mutation API ───
location ~ ^/api/v1/(notifications|ddays|comments|posts|push-tokens|upload|members/me) {
    limit_req zone=g5_api_write burst=20 nodelay;
    rewrite ^/api/(.*)$ /api/index.php?_route=$1 last;
}

# ─── 그 외 일반 read API ───
location /api/ {
    limit_req zone=g5_api_read burst=50 nodelay;
    rewrite ^/api/(.*)$ /api/index.php?_route=$1 last;
}
