#
# Compatibility map for older Next.js 25 nginx installs.
#
# HTML document CSP is emitted by the PHP theme bridge with a per-request
# script nonce. This map intentionally carries an empty value so existing
# nginx.conf include lines remain valid without reintroducing a fixed CSP.
#

map $uri $g5_nextjs_default_csp {
    default "";
}
