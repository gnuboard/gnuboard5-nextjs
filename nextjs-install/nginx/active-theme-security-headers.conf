#
# Theme/app security headers for whichever Next.js Gnuboard theme is active.
#
# Install as:
#   /etc/nginx/snippets/g5-active-theme-security-headers.conf
#
# Include from frontend/static locations that route through plugin/webapp/bridge/route.php.
# Do not include this snippet inside /api/ locations; keep API-specific headers
# separate so JSON responses can use their stricter Referrer-Policy.
#

fastcgi_hide_header X-Content-Type-Options;
fastcgi_hide_header X-Frame-Options;
fastcgi_hide_header Referrer-Policy;
fastcgi_hide_header Permissions-Policy;
fastcgi_hide_header X-DNS-Prefetch-Control;
fastcgi_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header X-DNS-Prefetch-Control;
proxy_hide_header Strict-Transport-Security;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-DNS-Prefetch-Control "on" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# HTML document CSP is emitted by the active theme PHP bridge with a
# per-request script nonce. Static assets keep the transport/browser hardening
# headers above and do not receive a document CSP from nginx.
