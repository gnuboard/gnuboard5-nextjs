#
# API security headers for the G5 Next.js 25 live runtime.
#
# Install as:
#   /etc/nginx/snippets/g5-nextjs_default-api-security-headers.conf
#
# Include inside the /api/ PHP-FPM location. It defines its own add_header
# directives so nginx does not inherit the frontend Referrer-Policy/CSP rules
# from a parent server block.
#

fastcgi_hide_header X-Content-Type-Options;
fastcgi_hide_header X-Frame-Options;
fastcgi_hide_header Referrer-Policy;
fastcgi_hide_header Permissions-Policy;
fastcgi_hide_header X-DNS-Prefetch-Control;
fastcgi_hide_header X-Permitted-Cross-Domain-Policies;
fastcgi_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header X-DNS-Prefetch-Control;
proxy_hide_header X-Permitted-Cross-Domain-Policies;
proxy_hide_header Strict-Transport-Security;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-DNS-Prefetch-Control "off" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
