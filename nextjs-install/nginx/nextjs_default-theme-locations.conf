#
# Route locations for the G5 Next.js 25 static theme.
#
# Install as:
#   /etc/nginx/snippets/g5-nextjs_default-theme-locations.conf
#
# Include inside the example.com server {} block before the generic
# Gnuboard location rules. This snippet assumes the server already has a PHP-FPM
# handler for *.php and that Gnuboard has selected theme/nextjs_default as the active
# theme.
#

# Root should enter the Next.js 25 bridge directly. A generic
# `try_files $uri $uri/ ...` often stops at the Gnuboard document root and
# renders the legacy basic theme instead.
location = / {
    include /etc/nginx/snippets/g5-nextjs_default-security-headers.conf;
    expires -1;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    rewrite ^ /theme/nextjs_default/route.php last;
}

# Public root assets are generated by the Next.js export but must remain
# available from the site root for browsers, crawlers, and service workers.
location ~ ^/(robots\.txt|sitemap(?:-posts)?\.xml|manifest\.webmanifest|manifest\.json|sw\.js|favicon\.ico|icon-[0-9]+\.png|og-default\.png|kcp-bridge\.html)$ {
    include /etc/nginx/snippets/g5-nextjs_default-security-headers.conf;
    expires -1;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    rewrite ^/(robots\.txt|sitemap(?:-posts)?\.xml|manifest\.webmanifest|manifest\.json|sw\.js|favicon\.ico|icon-[0-9]+\.png|og-default\.png|kcp-bridge\.html)$ /theme/nextjs_default/route.php?g5_nextjs_default_asset=$1 last;
}

# /_next/* goes through the theme bridge, never straight from disk. The static
# build is portable: some chunks carry a /__g5base__ placeholder that the bridge
# replaces with the install folder on the way out. Served raw (alias, root or
# try_files into theme/<name>/app) the page loads but links and client
# navigation break. The bridge also sends the cache headers itself: hashed
# /_next/static/* files get "public, max-age=31536000, immutable" plus an ETag.
location ^~ /_next/ {
    include /etc/nginx/snippets/g5-nextjs_default-security-headers.conf;
    rewrite ^ /theme/nextjs_default/route.php last;
}

# Direct export asset requests under the theme directory should keep the same
# frontend security posture as app-shell responses.
location ^~ /theme/nextjs_default/app/ {
    include /etc/nginx/snippets/g5-nextjs_default-security-headers.conf;
    expires -1;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri =404;
}

# RSC payloads requested by the static export, for example /free.txt?_rsc=...
location ~ ^/.+\.txt$ {
    include /etc/nginx/snippets/g5-nextjs_default-security-headers.conf;
    expires -1;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    rewrite ^ /theme/nextjs_default/route.php last;
}

# RSS remains a Gnuboard PHP feed, but route it through the bridge so the same
# active-theme and base-path checks are applied.
location ~ ^/(?:boards/[0-9A-Za-z_]+/rss|rss/[0-9A-Za-z_]+)$ {
    rewrite ^ /theme/nextjs_default/route.php last;
}

# Public Gnuboard BBS entrypoints that have canonical Next.js screens. Keep
# action endpoints such as write_update.php, login_check.php, and qawrite_update.php
# on the original PHP handler.
location ~ ^/bbs/(?:login|register|register_form|register_result|password_lost|poll_result|qalist|qaview|qawrite|memo|memo_form|memo_view|profile|point|scrap|board|write|content|group|faq|new|search)\.php$ {
    include /etc/nginx/snippets/g5-nextjs_default-security-headers.conf;
    rewrite ^ /theme/nextjs_default/route.php last;
}

# Canonical Next.js app routes.
location ~ ^/(?:admin|boards|content|members|mypage)(?:/.*)?$ {
    include /etc/nginx/snippets/g5-nextjs_default-security-headers.conf;
    rewrite ^ /theme/nextjs_default/route.php last;
}

location ~ ^/(?:faq|forgot-password|login|offline|polls|recent|register|search)$ {
    include /etc/nginx/snippets/g5-nextjs_default-security-headers.conf;
    rewrite ^ /theme/nextjs_default/route.php last;
}

location ~ ^/shop/(?:cart|categories|compare|content|couponzone|events|largeimage|login|order|orders|payment|personalpay|products|qas|register|reviews|search|wishlist)(?:/.*)?$ {
    include /etc/nginx/snippets/g5-nextjs_default-security-headers.conf;
    rewrite ^ /theme/nextjs_default/route.php last;
}

# Canonical mobile Gnuboard home entry points must be handled before nginx can
# normalize the real /mobile directory to /mobile/.
location = /mobile {
    include /etc/nginx/snippets/g5-nextjs_default-security-headers.conf;
    return 301 /$is_args$args;
}

location = /mobile/ {
    include /etc/nginx/snippets/g5-nextjs_default-security-headers.conf;
    return 301 /$is_args$args;
}

location = /mobile/index.php {
    include /etc/nginx/snippets/g5-nextjs_default-security-headers.conf;
    rewrite ^ /theme/nextjs_default/route.php last;
}

location ~ ^/mobile/(?:content|group)\.php$ {
    include /etc/nginx/snippets/g5-nextjs_default-security-headers.conf;
    rewrite ^ /theme/nextjs_default/route.php last;
}

# Canonical mobile YoungCart entry points must be handled before nginx can
# normalize the real /mobile/shop directory to /mobile/shop/.
location = /mobile/shop {
    include /etc/nginx/snippets/g5-nextjs_default-security-headers.conf;
    return 301 /shop$is_args$args;
}

location = /mobile/shop/ {
    include /etc/nginx/snippets/g5-nextjs_default-security-headers.conf;
    return 301 /shop$is_args$args;
}

location ~ ^/mobile/shop/(?:index|cart|wishlist|category|coupon|event|item|iteminfo|itemqa|itemqaform|itemrecommend|itemstocksms|itemuse|itemuseform|largeimage|list|listtype|mypage|orderaddress|orderform|orderinquiry|orderinquiryview|personalpay|personalpayform|personalpayresult|search)\.php$ {
    include /etc/nginx/snippets/g5-nextjs_default-security-headers.conf;
    rewrite ^ /theme/nextjs_default/route.php last;
}

# Canonicalized YoungCart PHP entrypoints that should be normalized by the
# static theme bridge before the generic PHP-FPM location can execute them.
location ~ ^/shop/(?:index|cart|wishlist|couponzone|search|largeimage|mypage|orderinquiry|personalpay|category|event|item|iteminfo|list|listtype|orderform|orderinquirycancel|orderinquiryview|personalpayform|personalpayresult)\.php$ {
    include /etc/nginx/snippets/g5-nextjs_default-security-headers.conf;
    rewrite ^ /theme/nextjs_default/route.php last;
}

# Legacy YoungCart short URLs that the Next.js theme intentionally preserves.
location ~ ^/shop/(?:list-[0-9a-z]+|type-[0-9a-z]+|[0-9A-Za-z_-]+|[^/]+/)$ {
    include /etc/nginx/snippets/g5-nextjs_default-security-headers.conf;
    rewrite ^ /theme/nextjs_default/route.php last;
}

# Legacy Gnuboard board short URLs that the Next.js theme intentionally
# preserves. Keep this after the explicit app routes above so reserved paths
# such as /login and /shop do not get captured.
location ~ ^/(?!(?:admin|adm|api|bbs|content|css|data|faq|forgot-password|img|install|js|lib|login|members|mobile|offline|plugin|polls|recent|register|robots\.txt|search|shop|sitemap(?:-posts)?\.xml|theme)(?:/|$))[0-9A-Za-z_]+(?:/(?:[^/]+/|write|[0-9]+))?$ {
    include /etc/nginx/snippets/g5-nextjs_default-security-headers.conf;
    rewrite ^ /theme/nextjs_default/route.php last;
}

# Gnuboard 5.6.41+ keeps its DB migration SQL in /migrations/. Apache blocks it
# with migrations/.htaccess, but nginx ignores .htaccess, so deny it here.
# Harmless on older Gnuboard versions that have no such folder. For a sub-folder
# install, prefix the path (e.g. /gnuboard/migrations).
location = /migrations {
    return 404;
}
location ^~ /migrations/ {
    return 404;
}
