#
# nginx rate-limit 설정 — 운영 서버에 include 해서 사용.
#
# 사용법:
#   1) 이 파일을 운영 서버의 /etc/nginx/snippets/g5-rate-limit.conf 로 복사
#   2) /etc/nginx/nginx.conf 의 http {} 블록 끝에 추가:
#         include /etc/nginx/snippets/g5-rate-limit.conf;
#   3) /etc/nginx/sites-available/example.com 의 server {} 블록 안에
#      g5-rate-limit-locations.conf 도 include (아래 별도 파일 참고)
#   4) sudo nginx -t && sudo systemctl reload nginx
#
# 한도 정책
#   - api_auth   : 로그인/회원가입/소셜교환/devices/sign  IP당 10 req/min
#   - api_write  : 작성/수정/삭제/푸시토큰/업로드        IP당 60 req/min
#   - api_read   : 그 외 read 전체                       IP당 300 req/min
#
# 메모리: zone 당 10MB ≈ 16만 IP. 가벼움.
#

limit_req_zone $binary_remote_addr zone=g5_api_auth:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=g5_api_write:10m  rate=60r/m;
limit_req_zone $binary_remote_addr zone=g5_api_read:10m   rate=300r/m;

limit_req_status 429;
limit_req_log_level warn;
